              trigger_prototypes:
                - uuid: 2a74f76c65af4b83aaed23fdcfadfbc9
                  expression: 'last(/Universal Printer Supply Levels by SNMP/printer.error[{#SNMPINDEX},lowPaper])=1'
                  name: 'Printer [{#SNMPINDEX}]: Low paper'
                  priority: INFO
