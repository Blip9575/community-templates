zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: b37ab3eddd0448d78277ae5756adc5cd
      name: Templates/Printers
  templates:
    - uuid: aefd318077af43e68788bf7557e22504
      template: 'Universal Printer Supply Levels by SNMP'
      name: 'Universal Printer Supply Levels by SNMP'
      description: |
        # About
        As long as your MFP follows the Printer MIB standard, this template will discover all installed "Supplies" in your MFP via SNMP. "Marker Supplies" is the term used in the Printer MIB for toner, ink, and other consumable substances that make a mark on whatever you're printing on.
        
        ## What's provided
        Item prototypes use the "current" and "max" values provided by SNMP to calculate the remaining amount in a percentage.
        
        Alert prototypes provide an info-level alert when the "low" threshold is crossed, and a warning-level alert when the "critical" threshold is crossed. These are 5% and 0% by default, and are adjustable with provided macros.
        
        ## Additional tweaking
        Depending on how your printer uses the Supplies table, you may end up with unused or duplicate items discovered. Every discovered item will have its SNMP index as part of the item key (e.g. supply.type.[5] for the supply at SNMP Index 5) - Any indices you wish to filter out of discovery, I've provided macros to do so.
        
        You can learn more about the Printer MIB by searching for it on your favorite search engine. It's old, hasn't changed, and is widely used and documented.
        
        ## Credits
        Author: Mick Swanson
      groups:
        - name: Templates/Printers
      items:
        - uuid: a0d0f0d65c3143fa9b29cd51047c4bf8
          name: 'Printer reachability (ICMP ping)'
          type: SIMPLE
          key: 'icmpping[,3]'
          description: 'ICMP ping with 3 packets: 1 = the printer answers, 0 = no reply. Uses its own key (not plain icmpping), so the template can be linked together with the "ICMP Ping" or "Network Generic Device by SNMP" templates.'
          valuemap:
            name: 'Service State'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: d33434ab97a84b5d90f9e23e376d27a3
              expression: 'max(/Universal Printer Supply Levels by SNMP/icmpping[,3],#3)=0'
              name: 'Printer is unreachable (asleep or switched off)'
              priority: INFO
              description: 'The printer has not answered ping for 3 checks. Printers in deep sleep / auto-off or switched off stop answering, which is usually expected, so this is informational. If an always-on printer must alert, raise the severity on a copy of the template, or use the "ICMP Ping" template instead.'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: befe941c7ada410ba027558a04b5f5d3
          name: 'Supply Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SUPPLY.TYPE},.1.3.6.1.2.1.43.11.1.1.6.1,{#SUPPLY.LEVEL},.1.3.6.1.2.1.43.11.1.1.9.1,{#SUPPLY.MAX},.1.3.6.1.2.1.43.11.1.1.8.1,{#SUPPLY.COLOR},.1.3.6.1.2.1.43.12.1.1.4.1]'
          key: supply.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SNMPINDEX}'
                value: '{$SNMPINDEX.MATCHES}'
              - macro: '{#SNMPINDEX}'
                value: '{$SNMPINDEX.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#SUPPLY.LEVEL}'
                value: '^[0-9]*$'
          item_prototypes:
            - uuid: f00546d36785405ca13ed814b3e3418a
              name: 'Remaining Supply: {#SUPPLY.TYPE}'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}]'
              key: 'supply.type.[{#SNMPINDEX}]'
              delay: 15m
              units: '%'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var max = '{#SUPPLY.MAX}';
                      return 100 * value / max
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: supply
              trigger_prototypes:
                - uuid: 147623c6e5ad4907916c06c79cec4498
                  expression: 'last(/Universal Printer Supply Levels by SNMP/supply.type.[{#SNMPINDEX}])<={$ALERT.CRITICAL.THRESHOLD}'
                  name: '{#SUPPLY.TYPE} level is Critical'
                  opdata: 'Critical ({ITEM.LASTVALUE})'
                  priority: WARNING
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 0fd85001a7eb4e5980940a986fbd398e
                  expression: 'last(/Universal Printer Supply Levels by SNMP/supply.type.[{#SNMPINDEX}])<={$ALERT.LOW.THRESHOLD}'
                  name: '{#SUPPLY.TYPE} level is Low'
                  opdata: 'Remaining: {ITEM.LASTVALUE}'
                  priority: INFO
                  manual_close: 'YES'
                  dependencies:
                    - name: '{#SUPPLY.TYPE} level is Critical'
                      expression: 'last(/Universal Printer Supply Levels by SNMP/supply.type.[{#SNMPINDEX}])<={$ALERT.CRITICAL.THRESHOLD}'
                  tags:
                    - tag: scope
                      value: notice
          graph_prototypes:
            - uuid: e06a1e25a11a43f4b85ec468fabb0bd7
              name: 'Supply Levels ({#SUPPLY.TYPE}.[{#SNMPINDEX}])'
              graph_items:
                - color: 199C0D
                  calc_fnc: ALL
                  item:
                    host: 'Universal Printer Supply Levels by SNMP'
                    key: 'supply.type.[{#SNMPINDEX}]'
          overrides:
            - name: 'Supply Color'
              step: '1'
              filter:
                conditions:
                  - macro: '{#SUPPLY.COLOR}'
                    operator: EXISTS
              operations:
                - operator: REGEXP
                  tags:
                    - tag: color
                      value: '{#SUPPLY.COLOR}'
        - uuid: 6144d4966202478f902e25db37c46104
          name: 'Printer status discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PRINTER.STATUS},.1.3.6.1.2.1.25.3.5.1.1]'
          key: printer.status.discovery
          delay: 1h
          description: 'Discovers printer devices (HOST-RESOURCES-MIB hrPrinterTable). Most printers have one, index 1.'
          item_prototypes:
            - uuid: 516163eebab6476cacb4b29c750d5ebb
              name: 'Printer [{#SNMPINDEX}]: Device status'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.25.3.2.1.5.{#SNMPINDEX}]'
              key: 'printer.device.status[{#SNMPINDEX}]'
              delay: '{$PRINTER.STATUS.INTERVAL}'
              description: 'hrDeviceStatus: unknown(1), running(2), warning(3), testing(4), down(5).'
              valuemap:
                name: hrDeviceStatus
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: printer
              trigger_prototypes:
                - uuid: b3ed0a52c43d490cb6cbccbd98669ef1
                  expression: 'last(/Universal Printer Supply Levels by SNMP/printer.device.status[{#SNMPINDEX}])=5'
                  name: 'Printer [{#SNMPINDEX}] is down'
                  priority: AVERAGE
                  description: 'The printer reports its device status as down (hrDeviceStatus = 5).'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: ea6ee362b87d4d6e824b601da78251be
              name: 'Printer [{#SNMPINDEX}]: Status'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.25.3.5.1.1.{#SNMPINDEX}]'
              key: 'printer.status[{#SNMPINDEX}]'
              delay: '{$PRINTER.STATUS.INTERVAL}'
              description: 'hrPrinterStatus: other(1), unknown(2), idle(3), printing(4), warmup(5).'
              valuemap:
                name: hrPrinterStatus
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: printer
            - uuid: 1fe086a65e04455bacbc477b0c6918b0
              name: 'Printer [{#SNMPINDEX}]: Detected error state (raw)'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.25.3.5.1.2.{#SNMPINDEX}]'
              key: 'printer.error.state[{#SNMPINDEX}]'
              delay: '{$PRINTER.STATUS.INTERVAL}'
              history: '0'
              value_type: TEXT
              description: 'hrPrinterDetectedErrorState: a bit string of error conditions, decoded to JSON for the dependent items.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = String(value).trim();
                      var bytes = [];
                      if (/^[0-9A-Fa-f]{2}(\s+[0-9A-Fa-f]{2})*$/.test(s)) {
                          s.split(/\s+/).forEach(function (h) { bytes.push(parseInt(h, 16)); });
                      }
                      else {
                          for (var i = 0; i < s.length; i++) {
                              bytes.push(s.charCodeAt(i) & 0xFF);
                          }
                      }
                      var names = [
                          ['lowPaper', 'noPaper', 'lowToner', 'noToner', 'doorOpen', 'jammed', 'offline', 'serviceRequested'],
                          ['inputTrayMissing', 'outputTrayMissing', 'markerSupplyMissing', 'outputNearFull', 'outputFull', 'inputTrayEmpty', 'overduePreventMaint']
                      ];
                      var flags = {}, active = [];
                      for (var b = 0; b < names.length; b++) {
                          for (var j = 0; j < names[b].length; j++) {
                              var on = ((bytes[b] || 0) >> (7 - j)) & 1;
                              flags[names[b][j]] = on;
                              if (on) {
                                  active.push(names[b][j]);
                              }
                          }
                      }
                      return JSON.stringify({flags: flags, active: active.length ? active.join(', ') : 'none'});
              tags:
                - tag: component
                  value: raw
            - uuid: a381ebda75374a08b25beb6ffc7f1537
              name: 'Printer [{#SNMPINDEX}]: Active error conditions'
              type: DEPENDENT
              key: 'printer.error.active[{#SNMPINDEX}]'
              value_type: TEXT
              description: 'Active hrPrinterDetectedErrorState conditions, comma-separated, or "none".'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.active
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'printer.error.state[{#SNMPINDEX}]'
              tags:
                - tag: component
                  value: printer
            - uuid: f9d302c241f44a6dbaa3728485de7881
              name: 'Printer [{#SNMPINDEX}]: Condition lowPaper'
              type: DEPENDENT
              key: 'printer.error[{#SNMPINDEX},lowPaper]'
