zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: b37ab3eddd0448d78277ae5756adc5cd
      name: Templates/Printers
  templates:
    - uuid: aefd318077af43e68788bf7557e22504
      template: 'Universal Printer Supply Levels by SNMP'
      name: 'Universal Printer Supply Levels by SNMP'
      description: |
        # About
        As long as your MFP follows the Printer MIB standard, this template will discover all installed "Supplies" in your MFP via SNMP. "Marker Supplies" is the term used in the Printer MIB for toner, ink, and other consumable substances that make a mark on whatever you're printing on.
        
        ## What's provided
        Item prototypes use the "current" and "max" values provided by SNMP to calculate the remaining amount in a percentage.
        
        Alert prototypes provide an info-level alert when the "low" threshold is crossed, and a warning-level alert when the "critical" threshold is crossed. These are 5% and 0% by default, and are adjustable with provided macros.
        
        ## Additional tweaking
        Depending on how your printer uses the Supplies table, you may end up with unused or duplicate items discovered. Every discovered item will have its SNMP index as part of the item key (e.g. supply.type.[5] for the supply at SNMP Index 5) - Any indices you wish to filter out of discovery, I've provided macros to do so.
        
        You can learn more about the Printer MIB by searching for it on your favorite search engine. It's old, hasn't changed, and is widely used and documented.
        
        ## Credits
        Author: Mick Swanson
      groups:
        - name: Templates/Printers
      items:
        - uuid: a0d0f0d65c3143fa9b29cd51047c4bf8
          name: 'ICMP Ping'
          type: SIMPLE
          key: icmpping
          valuemap:
            name: 'Service State'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: d33434ab97a84b5d90f9e23e376d27a3
              expression: 'max(/Universal Printer Supply Levels by SNMP/icmpping,#3)=0'
              name: 'Unavailable by ICMP ping'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: befe941c7ada410ba027558a04b5f5d3
          name: 'Supply Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SUPPLY.TYPE},.1.3.6.1.2.1.43.11.1.1.6.1,{#SUPPLY.LEVEL},.1.3.6.1.2.1.43.11.1.1.9.1,{#SUPPLY.MAX},.1.3.6.1.2.1.43.11.1.1.8.1,{#SUPPLY.COLOR},.1.3.6.1.2.1.43.12.1.1.4.1]'
          key: supply.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SNMPINDEX}'
                value: '{$SNMPINDEX.MATCHES}'
              - macro: '{#SNMPINDEX}'
                value: '{$SNMPINDEX.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#SUPPLY.LEVEL}'
                value: '^[0-9]*$'
          item_prototypes:
            - uuid: f00546d36785405ca13ed814b3e3418a
              name: 'Remaining Supply: {#SUPPLY.TYPE}'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}]'
              key: 'supply.type.[{#SNMPINDEX}]'
              delay: 15m
              units: '%'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var max = '{#SUPPLY.MAX}';
                      return 100 * value / max
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: supply
              trigger_prototypes:
                - uuid: 147623c6e5ad4907916c06c79cec4498
                  expression: 'last(/Universal Printer Supply Levels by SNMP/supply.type.[{#SNMPINDEX}])<={$ALERT.CRITICAL.THRESHOLD}'
                  name: '{#SUPPLY.TYPE} level is Critical'
                  opdata: 'Critical ({ITEM.LASTVALUE})'
                  priority: WARNING
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 0fd85001a7eb4e5980940a986fbd398e
                  expression: 'last(/Universal Printer Supply Levels by SNMP/supply.type.[{#SNMPINDEX}])<={$ALERT.LOW.THRESHOLD}'
                  name: '{#SUPPLY.TYPE} level is Low'
                  opdata: 'Remaining: {ITEM.LASTVALUE}'
                  priority: INFO
                  manual_close: 'YES'
                  dependencies:
                    - name: '{#SUPPLY.TYPE} level is Critical'
                      expression: 'last(/Universal Printer Supply Levels by SNMP/supply.type.[{#SNMPINDEX}])<={$ALERT.CRITICAL.THRESHOLD}'
                  tags:
                    - tag: scope
                      value: notice
          graph_prototypes:
            - uuid: e06a1e25a11a43f4b85ec468fabb0bd7
              name: 'Supply Levels ({#SUPPLY.TYPE}.[{#SNMPINDEX}])'
              graph_items:
                - color: 199C0D
                  calc_fnc: ALL
                  item:
                    host: 'Universal Printer Supply Levels by SNMP'
                    key: 'supply.type.[{#SNMPINDEX}]'
          overrides:
            - name: 'Supply Color'
              step: '1'
              filter:
                conditions:
                  - macro: '{#SUPPLY.COLOR}'
                    operator: EXISTS
              operations:
                - operator: REGEXP
                  tags:
                    - tag: color
                      value: '{#SUPPLY.COLOR}'
        - uuid: b2d24574b3cf4e55882704dd8a56681c
          name: 'Input tray discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TRAY.NAME},.1.3.6.1.2.1.43.8.2.1.13,{#TRAY.MAX},.1.3.6.1.2.1.43.8.2.1.9]'
          key: printer.tray.discovery
          delay: 1h
          description: 'Discovers paper input trays (Printer-MIB prtInputTable). By default only trays with a capacity of 2 sheets or more (skips manual / single-sheet feeds); see {$PRINTER.TRAY.MAX.MATCHES} and {$PRINTER.TRAY.NOT_MATCHES}.'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#TRAY.MAX}'
                value: '{$PRINTER.TRAY.MAX.MATCHES}'
              - macro: '{#TRAY.NAME}'
                value: '{$PRINTER.TRAY.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          item_prototypes:
            - uuid: 67d910ceeb1a41dbbc2e014c55045e65
              name: 'Tray [{#TRAY.NAME}]: Paper level'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}]'
              key: 'printer.tray.level[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              description: 'prtInputCurrentLevel in sheets (capacity {#TRAY.MAX}); -3 = some paper (level not measured), -2 = unknown, 0 = empty.'
              valuemap:
                name: prtInputLevel
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: tray
              trigger_prototypes:
                - uuid: 86486388065d48bba59f759685ac2028
                  expression: 'last(/Universal Printer Supply Levels by SNMP/printer.tray.level[{#SNMPINDEX}])=0'
                  name: 'Tray [{#TRAY.NAME}] is empty'
                  priority: WARNING
                  description: 'The tray reports no paper (prtInputCurrentLevel = 0).'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 6c9b7b0760ba4e6ba42739f0696aaf47
              name: 'Tray [{#TRAY.NAME}]: Status'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.43.8.2.1.11.{#SNMPINDEX}]'
              key: 'printer.tray.status[{#SNMPINDEX}]'
              delay: 5m
              description: 'prtInputStatus (PrtSubUnitStatusTC bit field): availability 0-6 in bits 0-2, 8 = non-critical alert, 16 = critical alert, 32 = off-line, 64 = transitioning.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: tray
              trigger_prototypes:
                - uuid: d12090455a194c9ea4c6ec7a74742c98
                  expression: 'bitand(last(/Universal Printer Supply Levels by SNMP/printer.tray.status[{#SNMPINDEX}]),16)=16'
                  name: 'Tray [{#TRAY.NAME}] reports a critical alert'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The tray status has the critical-alert bit (16) set, e.g. tray missing or jammed at the tray.'
                  tags:
                    - tag: scope
                      value: availability
      tags:
        - tag: class
          value: hardware
        - tag: target
          value: copier
        - tag: target
          value: printer
      macros:
        - macro: '{$ALERT.CRITICAL.THRESHOLD}'
          value: '0'
          description: 'Provides a "Warning" level alert at this percentage remaining.'
        - macro: '{$ALERT.LOW.THRESHOLD}'
          value: '5'
          description: 'Provides an "Info" level alert at this percentage remaining.'
        - macro: '{$PRINTER.TRAY.MAX.MATCHES}'
          value: '^([2-9]|[1-9][0-9]+)$'
          description: 'Input tray discovery: capacity (sheets) a tray must match to be discovered. Default skips manual / single-sheet feeds (capacity 1) and unknown capacities.'
        - macro: '{$PRINTER.TRAY.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Input tray discovery: tray names to skip.'
        - macro: '{$SNMPINDEX.MATCHES}'
          value: '^.*$'
          description: 'Used in Supply discovery. Can be overridden on the host or linked template level.'
        - macro: '{$SNMPINDEX.NOT_MATCHES}'
          value: '^(?:CHANGE|ME)$'
          description: 'Used in Supply discovery. Can be overridden on the host or linked template level. Find the SNMP Index by checking the key name of your item. Has to use this format: ^(?:1|2|3)$ where indices 1,2, and 3 will be ignored.'
      valuemaps:
        - uuid: a631c9e9fc9c4a60a989d4ff37cbd316
          name: 'Service State'
          mappings:
            - value: '1'
              newvalue: Up
            - value: '0'
              newvalue: Down
        - uuid: da689299837846bbb2b4429e23fc9696
          name: prtInputLevel
          mappings:
            - value: '-3'
              newvalue: 'some paper'
            - value: '-2'
              newvalue: unknown
            - value: '-1'
              newvalue: other
            - value: '0'
              newvalue: empty
