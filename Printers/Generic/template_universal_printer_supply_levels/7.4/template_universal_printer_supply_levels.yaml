                - uuid: 4dacea6611ac4e408c1a3acabe909cbf
                  expression: 'last(/Universal Printer Supply Levels by SNMP/printer.error[{#SNMPINDEX},inputTrayEmpty])=1'
                  name: 'Printer [{#SNMPINDEX}]: Input tray empty'
                  priority: WARNING
                  description: 'The printer reports the condition inputTrayEmpty (hrPrinterDetectedErrorState).'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: a4ff8ab4879844c99edd541cf1c1ddc4
              name: 'Printer [{#SNMPINDEX}]: Condition overduePreventMaint'
              type: DEPENDENT
              key: 'printer.error[{#SNMPINDEX},overduePreventMaint]'
              description: 'hrPrinterDetectedErrorState bit overduePreventMaint: 1 = set.'
              valuemap:
                name: 'Printer error flag'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.flags.overduePreventMaint
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'printer.error.state[{#SNMPINDEX}]'
              tags:
                - tag: component
                  value: printer
              trigger_prototypes:
                - uuid: 568da3ca8b0e4f0f865ddc016d10e452
                  expression: 'last(/Universal Printer Supply Levels by SNMP/printer.error[{#SNMPINDEX},overduePreventMaint])=1'
                  name: 'Printer [{#SNMPINDEX}]: Preventive maintenance overdue'
                  priority: INFO
                  description: 'The printer reports the condition overduePreventMaint (hrPrinterDetectedErrorState).'
                  tags:
                    - tag: scope
                      value: notice
        - uuid: b1b1345fd849493f9337340bd9842d76
          name: 'Cover discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#COVER.NAME},.1.3.6.1.2.1.43.6.1.1.2]'
          key: printer.cover.discovery
          delay: 1h
          description: 'Discovers printer covers and interlocks (Printer-MIB prtCoverTable).'
          item_prototypes:
            - uuid: f9af71167a084a838ad22db5e4a151d7
              name: 'Cover [{#COVER.NAME}]: Status'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.43.6.1.1.3.{#SNMPINDEX}]'
              key: 'printer.cover.status[{#SNMPINDEX}]'
              delay: 1m
              description: 'prtCoverStatus: other(1), unknown(2), coverOpen(3), coverClosed(4), interlockOpen(5), interlockClosed(6).'
              valuemap:
                name: prtCoverStatus
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: cover
              trigger_prototypes:
                - uuid: 27576c93a2444d2781293f475fb2ba91
                  expression: 'last(/Universal Printer Supply Levels by SNMP/printer.cover.status[{#SNMPINDEX}])=3 or last(/Universal Printer Supply Levels by SNMP/printer.cover.status[{#SNMPINDEX}])=5'
                  name: 'Cover [{#COVER.NAME}] is open'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The printer reports the cover or its interlock as open (prtCoverStatus 3 or 5).'
                  tags:
                    - tag: scope
                      value: availability
        - uuid: b2d24574b3cf4e55882704dd8a56681c
          name: 'Input tray discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TRAY.NAME},.1.3.6.1.2.1.43.8.2.1.13,{#TRAY.MAX},.1.3.6.1.2.1.43.8.2.1.9]'
          key: printer.tray.discovery
          delay: 1h
          description: 'Discovers paper input trays (Printer-MIB prtInputTable). By default only trays with a capacity of 2 sheets or more (skips manual / single-sheet feeds); see {$PRINTER.TRAY.MAX.MATCHES} and {$PRINTER.TRAY.NOT_MATCHES}.'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#TRAY.MAX}'
                value: '{$PRINTER.TRAY.MAX.MATCHES}'
              - macro: '{#TRAY.NAME}'
                value: '{$PRINTER.TRAY.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          item_prototypes:
            - uuid: 67d910ceeb1a41dbbc2e014c55045e65
              name: 'Tray [{#TRAY.NAME}]: Paper level'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.43.8.2.1.10.{#SNMPINDEX}]'
              key: 'printer.tray.level[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              description: 'prtInputCurrentLevel in sheets (capacity {#TRAY.MAX}); -3 = some paper (level not measured), -2 = unknown, 0 = empty.'
              valuemap:
                name: prtInputLevel
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: tray
              trigger_prototypes:
                - uuid: 86486388065d48bba59f759685ac2028
                  expression: 'last(/Universal Printer Supply Levels by SNMP/printer.tray.level[{#SNMPINDEX}])=0'
                  name: 'Tray [{#TRAY.NAME}] is empty'
                  priority: WARNING
                  description: 'The tray reports no paper (prtInputCurrentLevel = 0).'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 6c9b7b0760ba4e6ba42739f0696aaf47
              name: 'Tray [{#TRAY.NAME}]: Status'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.43.8.2.1.11.{#SNMPINDEX}]'
              key: 'printer.tray.status[{#SNMPINDEX}]'
              delay: 5m
              description: 'prtInputStatus (PrtSubUnitStatusTC bit field): availability 0-6 in bits 0-2, 8 = non-critical alert, 16 = critical alert, 32 = off-line, 64 = transitioning.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: tray
              trigger_prototypes:
                - uuid: d12090455a194c9ea4c6ec7a74742c98
                  expression: 'bitand(last(/Universal Printer Supply Levels by SNMP/printer.tray.status[{#SNMPINDEX}]),16)=16'
                  name: 'Tray [{#TRAY.NAME}] reports a critical alert'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The tray status has the critical-alert bit (16) set, e.g. tray missing or jammed at the tray.'
                  tags:
                    - tag: scope
                      value: availability
        - uuid: 77dc1bdea3474210b20f4ae1a36cd7ff
          name: 'Marker discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#MARKER.UNIT},.1.3.6.1.2.1.43.10.2.1.3.1]'
          key: printer.marker.discovery
          delay: 1h
          description: 'Discovers the print engines (Printer-MIB prtMarkerTable, usually one).'
          item_prototypes:
            - uuid: 1438205977374bd2880bbd297bf7a90d
              name: 'Marker [{#SNMPINDEX}]: Lifetime count'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.43.10.2.1.4.1.{#SNMPINDEX}]'
              key: 'printer.marker.count[{#SNMPINDEX}]'
              delay: 15m
              units: '{$PRINTER.COUNT.UNITS}'
              description: 'prtMarkerLifeCount: pages printed over the printer''s life, in prtMarkerCounterUnit {#MARKER.UNIT} (7 = impressions, 8 = sheets).'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: marker
            - uuid: fc68e7cd022f48afb49961d8ada090bc
              name: 'Marker [{#SNMPINDEX}]: Pages per day'
              type: DEPENDENT
              key: 'printer.marker.rate[{#SNMPINDEX}]'
              value_type: FLOAT
              units: '{$PRINTER.COUNT.UNITS}/day'
              description: 'Print rate from the lifetime count (change per second x 86400).'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '86400'
              master_item:
                key: 'printer.marker.count[{#SNMPINDEX}]'
              tags:
                - tag: component
                  value: marker
            - uuid: cfc297f2db754db0a61194663b2be5e8
              name: 'Marker [{#SNMPINDEX}]: Status'
              type: SNMP_AGENT
              snmp_oid: 'get[.1.3.6.1.2.1.43.10.2.1.15.1.{#SNMPINDEX}]'
              key: 'printer.marker.status[{#SNMPINDEX}]'
              delay: 5m
              description: 'prtMarkerStatus (PrtSubUnitStatusTC bit field): availability 0-6 in bits 0-2, 8 = non-critical alert, 16 = critical alert, 32 = off-line, 64 = transitioning.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: marker
              trigger_prototypes:
                - uuid: 80aa36ef4d1d4d34a6badba35e51fb05
                  expression: 'bitand(last(/Universal Printer Supply Levels by SNMP/printer.marker.status[{#SNMPINDEX}]),16)=16'
                  name: 'Marker [{#SNMPINDEX}]: print engine reports a critical alert'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The print engine status has the critical-alert bit (16) set.'
                  tags:
                    - tag: scope
                      value: availability
      tags:
        - tag: class
          value: hardware
        - tag: target
          value: copier
        - tag: target
          value: printer
      macros:
        - macro: '{$ALERT.CRITICAL.THRESHOLD}'
          value: '0'
          description: 'Provides a "Warning" level alert at this percentage remaining.'
        - macro: '{$ALERT.LOW.THRESHOLD}'
          value: '5'
          description: 'Provides an "Info" level alert at this percentage remaining.'
        - macro: '{$PRINTER.STATUS.INTERVAL}'
          value: 1m
          description: 'Update interval of the printer status and error state items.'
        - macro: '{$PRINTER.TRAY.MAX.MATCHES}'
          value: '^([2-9]|[1-9][0-9]+)$'
          description: 'Input tray discovery: capacity (sheets) a tray must match to be discovered. Default skips manual / single-sheet feeds (capacity 1) and unknown capacities.'
        - macro: '{$PRINTER.TRAY.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Input tray discovery: tray names to skip.'
        - macro: '{$PRINTER.COUNT.UNITS}'
          value: pages
          description: 'Units shown for the lifetime count and print rate.'
        - macro: '{$SNMPINDEX.MATCHES}'
          value: '^.*$'
          description: 'Used in Supply discovery. Can be overridden on the host or linked template level.'
        - macro: '{$SNMPINDEX.NOT_MATCHES}'
          value: '^(?:CHANGE|ME)$'
          description: 'Used in Supply discovery. Can be overridden on the host or linked template level. Find the SNMP Index by checking the key name of your item. Has to use this format: ^(?:1|2|3)$ where indices 1,2, and 3 will be ignored.'
      valuemaps:
        - uuid: a631c9e9fc9c4a60a989d4ff37cbd316
          name: 'Service State'
          mappings:
            - value: '1'
              newvalue: Up
            - value: '0'
              newvalue: Down
        - uuid: 0bc89c344e1c48a5bbe0e8b6f9ff7e80
          name: hrDeviceStatus
          mappings:
            - value: '1'
              newvalue: unknown
            - value: '2'
              newvalue: running
            - value: '3'
              newvalue: warning
            - value: '4'
              newvalue: testing
            - value: '5'
              newvalue: down
        - uuid: 65d5f419a80b4225ab37b91a3def2c9e
          name: hrPrinterStatus
          mappings:
            - value: '1'
              newvalue: other
            - value: '2'
              newvalue: unknown
            - value: '3'
              newvalue: idle
            - value: '4'
              newvalue: printing
            - value: '5'
              newvalue: warmup
        - uuid: 7730e127750b4c5d8110f9f4a44d1f62
          name: 'Printer error flag'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: 'Yes'
        - uuid: a7c2783d98a04bfc9d609d24adf7df86
          name: prtCoverStatus
          mappings:
            - value: '1'
              newvalue: other
            - value: '2'
              newvalue: unknown
            - value: '3'
              newvalue: coverOpen
            - value: '4'
              newvalue: coverClosed
            - value: '5'
              newvalue: interlockOpen
            - value: '6'
              newvalue: interlockClosed
        - uuid: da689299837846bbb2b4429e23fc9696
          name: prtInputLevel
          mappings:
            - value: '-3'
              newvalue: 'some paper'
            - value: '-2'
              newvalue: unknown
            - value: '-1'
              newvalue: other
            - value: '0'
              newvalue: empty
